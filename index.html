<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Informasi Data Siswa - Full Detail</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SweetAlert2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased">

  <!-- TOP NAVIGATION BAR -->
  <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-800 rounded-lg flex items-center justify-center text-indigo-200 shadow">
          <i class="fa-solid fa-database text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Direktori Data Siswa</h1>
          <p class="text-xs text-indigo-200">Full Data Tanpa Sensor</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="loadStudentsData(true)" class="bg-indigo-800 hover:bg-indigo-700 px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-2 transition" title="Muat Ulang Data">
          <i class="fa-solid fa-rotate"></i> Muat Ulang
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENT BODY -->
  <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto space-y-6">
    
    <!-- SEARCH & TABLE SECTION -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-5 border-b border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <h3 class="font-bold text-lg text-slate-800">Tabel Keseluruhan Data Siswa</h3>
          <p class="text-xs text-slate-500">Seluruh kolom dari Google Sheet ditampilkan secara lengkap dan transparan</p>
        </div>
        <div class="relative flex-1 md:w-80">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-search"></i>
          </span>
          <input type="text" id="searchInput" oninput="filterTable()" placeholder="Cari data siswa..." class="w-full pl-9 pr-4 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm outline-none">
        </div>
      </div>

      <!-- TABLE CONTAINER -->
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse" id="studentsTable">
          <thead>
            <tr id="tableHeaderRow" class="bg-slate-100 text-slate-600 text-xs font-semibold uppercase tracking-wider border-b border-slate-200">
              <!-- Header dinamis dari Google Sheet -->
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-200 text-sm text-slate-700">
            <tr>
              <td colspan="10" class="py-12 text-center text-slate-400">
                <div class="flex flex-col items-center justify-center gap-2">
                  <i class="fa-solid fa-spinner fa-spin text-3xl text-indigo-600"></i>
                  <span>Mengambil seluruh data dari Google Sheet...</span>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- MODAL DETAIL ROW / BERKAS -->
  <div id="detailModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden">
      <div class="p-4 bg-indigo-900 text-white flex items-center justify-between">
        <h3 class="font-bold text-lg"><i class="fa-solid fa-circle-info"></i> Detail Lengkap Baris Data</h3>
        <button onclick="closeDetailModal()" class="w-8 h-8 rounded-full bg-indigo-800 hover:bg-indigo-700 flex items-center justify-center text-white transition"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="p-6 overflow-y-auto flex-1 space-y-3 text-sm" id="detailModalContent">
        <!-- Konten detail lengkap -->
      </div>
      <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-end">
        <button onclick="closeDetailModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition">Tutup</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
